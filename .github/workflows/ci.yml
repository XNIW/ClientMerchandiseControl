name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate workflow action pins
        run: bash scripts/check-action-pins.sh
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Validate client security boundary
        run: |
          bash scripts/check-client-security.sh
          bash scripts/test-client-security-scan.sh
      - name: Validate governance state
        run: bash scripts/check-governance-state.sh
      - name: Validate architecture boundaries
        run: |
          bash scripts/check-architecture-boundaries.sh
          bash scripts/test-architecture-boundaries.sh
      - name: Set up Flutter
        # subosito/flutter-action v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Validate Flutter toolchain
        run: bash scripts/resolve-flutter.sh
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Validate release metadata and native assets
        run: bash scripts/check-release-metadata.sh
      - name: Verify generated and locked files
        run: |
          git diff --exit-code -- pubspec.lock lib/l10n/generated
          if [[ -n "$(git status --porcelain --untracked-files=all -- pubspec.lock lib/l10n/generated)" ]]; then
            git status --short --untracked-files=all -- pubspec.lock lib/l10n/generated
            exit 1
          fi
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test with coverage
        run: flutter test --coverage --exclude-tags performance
      - name: Performance gate
        run: flutter test --tags performance --concurrency=1
      - name: Check whitespace errors
        run: git diff --check

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Flutter
        # subosito/flutter-action v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Validate Flutter toolchain
        run: bash scripts/resolve-flutter.sh
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build APK
        run: flutter build apk --debug
      - name: Validate Android bundle security
        run: >-
          bash scripts/check-client-security.sh
          --artifact build/app/outputs/flutter-apk/app-debug.apk

  android-release:
    name: Android release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Flutter
        # subosito/flutter-action v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Validate Flutter toolchain
        run: bash scripts/resolve-flutter.sh
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build production-like unsigned AAB
        run: >-
          flutter build appbundle --release
          --dart-define-from-file=config/app_config.production.release.json
      - name: Build production-like unsigned inspection APK
        run: >-
          flutter build apk --release
          --dart-define-from-file=config/app_config.production.release.json
      - name: Validate Android release candidate
        run: >-
          bash scripts/check-android-release.sh
          --aab build/app/outputs/bundle/release/app-release.aab
          --apk build/app/outputs/flutter-apk/app-release.apk
      - name: Validate Android v2-only signature boundary
        run: >-
          bash scripts/test-android-release-signature.sh
          --aab build/app/outputs/bundle/release/app-release.aab
          --apk build/app/outputs/flutter-apk/app-release.apk

  ios-build:
    name: iOS Simulator debug build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Flutter
        # subosito/flutter-action v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Validate Flutter toolchain
        run: bash scripts/resolve-flutter.sh
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build iOS Simulator
        run: flutter build ios --simulator --debug
      - name: Validate iOS bundle security
        run: >-
          bash scripts/check-client-security.sh
          --artifact build/ios/iphonesimulator/Runner.app
