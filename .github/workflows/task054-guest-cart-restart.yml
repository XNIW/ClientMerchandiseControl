name: TASK054 guest cart process restart

# Il push della sola branch isolata abilita la prima esecuzione anche prima che
# una workflow_dispatch nuova sia registrata nella default branch.
# Ogni piattaforma ha processo, sandbox e receipt distinti dal journal indirizzi.
# Il marker [guest-restart] avvia il gate dopo format/analyze hosted del freeze.
on:
  push:
    branches:
      - codex/task054-cart-tracking-*
    paths:
      - .github/workflows/task054-guest-cart-restart.yml
      - integration_test/guest_cart_native_restart_test.dart
      - scripts/run-guest-cart-restart-android.py
      - scripts/run-guest-cart-restart-ios.py
      - scripts/test-guest-cart-process-restart.py
      - scripts/test-task054-ios-readiness.py
      - scripts/test-task054-ios-descriptor-observation.py
      - scripts/test-task054-ios-descriptor-launchd.py
      - scripts/run-address-journal-android.py
      - scripts/run-address-journal-ios.py
      - scripts/run-task054-android-visual.py
      - scripts/run-task054-ios-owned.py
      - lib/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:
    inputs:
      platform:
        description: Gate separato senza backend; ogni piattaforma usa il proprio runner
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  android-guest-cart:
    name: Guest cart Android two-process recovery
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[guest-restart]')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'android'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Validate receipt and ownership failure boundaries
        run: |
          bash scripts/check-action-pins.sh
          python3 scripts/test-guest-cart-process-restart.py
          python3 scripts/test-task054-ios-readiness.py
          python3 scripts/test-task054-ios-descriptor-observation.py
          python3 scripts/test-task054-ios-descriptor-launchd.py
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Validate toolchain and resolve locked dependencies
        run: |
          bash scripts/resolve-flutter.sh
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          git diff --exit-code -- pubspec.lock lib/l10n/generated
          dart format --output=none --set-exit-if-changed integration_test/guest_cart_native_restart_test.dart
          flutter analyze
      - name: Enable access to owned KVM runner
        run: |
          test -c /dev/kvm
          sudo -n chown "$(id -u):$(id -g)" /dev/kvm
          sudo -n chmod u+rw /dev/kvm
      - name: Seed force-stop and restore guest cart without VM transport
        run: python3 scripts/run-guest-cart-restart-android.py
      - name: Save independent guest cart evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task054-android-guest-cart-restart
          path: |
            build/task054/guest-cart-restart/*.json
            build/task054/guest-cart-restart-receipt.json
            build/task054/android-emulator.log
          if-no-files-found: warn
          retention-days: 7

  ios-guest-cart:
    name: Guest cart iOS two-process recovery
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[guest-restart]')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'ios'))
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Validate receipt and ownership failure boundaries
        run: |
          bash scripts/check-action-pins.sh
          python3 scripts/test-guest-cart-process-restart.py
          python3 scripts/test-task054-ios-readiness.py
          python3 scripts/test-task054-ios-descriptor-observation.py
          python3 scripts/test-task054-ios-descriptor-launchd.py
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Validate toolchain and resolve locked dependencies
        run: |
          bash scripts/resolve-flutter.sh
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          git diff --exit-code -- pubspec.lock lib/l10n/generated
          dart format --output=none --set-exit-if-changed integration_test/guest_cart_native_restart_test.dart
          flutter analyze
      - name: Prepare a new owned Simulator headless
        id: owned_prepare
        run: |
          mkdir -p build/task054
          python3 scripts/run-task054-ios-owned.py prepare \
            --receipt build/task054/ios-guest-cart-owned-receipt.json --headless \
            --readiness-attestation owned-descriptor-launchd --trace-processes
      - name: Retain bounded passive prepare trace
        id: prepare_trace
        if: always()
        timeout-minutes: 1
        env:
          CMC_PREPARE_OUTCOME: ${{ steps.owned_prepare.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat

          def private_file(path, mode, flags=0):
              return open(path, mode, opener=lambda name, base: os.open(
                  name, base | os.O_NOFOLLOW | flags, 0o600))

          def retain():
              outcome = os.environ.get('CMC_PREPARE_OUTCOME', '')
              if outcome in ('', 'skipped'):
                  print('NOT_RUN: prepare non tentata')
                  return 0
              if outcome not in ('success', 'failure', 'cancelled'):
                  print('FAIL: prepare outcome non riconosciuto')
                  return 2
              root = Path('build/task054')
              original = root / 'ios-guest-cart-owned-receipt.processes.jsonl'
              admitted = root / 'ios-guest-cart-prepare-trace'
              result = {'schemaVersion': 1, 'scope': 'ios_guest_prepare_trace_retention',
                        'prepareOutcome': outcome, 'status': 'FAIL',
                        'byteCap': 2097152, 'eventCap': 2048, 'reason': 'retentionIO'}
              acquired = False
              try:
                  admitted.mkdir(mode=0o700, parents=True, exist_ok=False)
                  acquired = True
                  with private_file(original, 'rb', os.O_NONBLOCK) as source:
                      observed = os.fstat(source.fileno())
                      if (not stat.S_ISREG(observed.st_mode) or observed.st_uid != os.geteuid()
                              or observed.st_mode & 0o077):
                          result['reason'] = 'unsafeTraceFile'
                          raise ValueError()
                      data = source.read(result['byteCap'] + 1)
                  result['reason'] = 'byteCap'
                  if not data or len(data) > result['byteCap']:
                      raise ValueError()
                  lines = data.splitlines()
                  result['reason'] = 'eventCap'
                  if len(lines) > result['eventCap']:
                      raise ValueError()
                  result['reason'] = 'traceShape'
                  if not data.endswith(b'\n'):
                      raise ValueError()
                  for sequence, line in enumerate(lines, 1):
                      row = json.loads(line)
                      if (not isinstance(row, dict) or type(row.get('sequence')) is not int
                              or row['sequence'] != sequence
                              or not isinstance(row.get('event'), str)
                              or not 1 <= len(row['event']) <= 80
                              or any(type(row.get(key)) is not int or row[key] < 0
                                     for key in ('monotonic_ns', 'elapsed_ns'))):
                          raise ValueError()
                  result['reason'] = 'retentionIO'
                  with private_file(admitted / 'processes.jsonl', 'xb') as saved:
                      saved.write(data)
                  result.update(status='PASS', reason='accepted', bytes=len(data),
                                events=len(lines), sha256=hashlib.sha256(data).hexdigest())
              except (OSError, ValueError, TypeError):
                  if not acquired:
                      print('FAIL: output retention non acquisibile')
                      return 2
              try:
                  with private_file(admitted / 'result.json', 'x') as saved:
                      saved.write(json.dumps(result, indent=2) + '\n')
                  # Booleani esatti: una scrittura parziale non esporta path parziali.
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as outputs:
                      outputs.write('result_ready=true\n')
                      if result['status'] == 'PASS':
                          outputs.write('trace_ready=true\n')
              except (OSError, KeyError):
                  print('FAIL: metadata retention non salvati')
                  return 2
              # Prepare resta uno step autonomo: il suo exit code non e riscritto.
              return 0 if result['status'] == 'PASS' else 2

          if __name__ == '__main__':
              raise SystemExit(retain())
          PY
      - name: Seed terminate and restore guest cart without VM transport
        run: >-
          python3 scripts/run-guest-cart-restart-ios.py
          --owner-receipt build/task054/ios-guest-cart-owned-receipt.json
      - name: Clean up the owned guest cart Simulator
        if: always()
        run: |
          if [[ -f build/task054/ios-guest-cart-owned-receipt.json ]]; then
            python3 scripts/run-task054-ios-owned.py cleanup \
              --receipt build/task054/ios-guest-cart-owned-receipt.json
          fi
      - name: Save independent guest cart evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task054-ios-guest-cart-restart
          path: |
            build/task054/ios-guest-cart-restart/*.json
            build/task054/ios-guest-cart-owned-receipt.json
            ${{ steps.prepare_trace.outputs.result_ready == 'true' && 'build/task054/ios-guest-cart-prepare-trace/result.json' || '' }}
            ${{ steps.prepare_trace.outputs.trace_ready == 'true' && 'build/task054/ios-guest-cart-prepare-trace/processes.jsonl' || '' }}
          if-no-files-found: warn
          retention-days: 7
