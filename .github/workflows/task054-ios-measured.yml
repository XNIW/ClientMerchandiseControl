name: TASK054 iOS measured

on:
  push:
    branches:
      - codex/task054-ios-preflight-measured
    paths:
      - .github/workflows/task054-ios-measured.yml
      - scripts/run-ios-preflight-measured.py
      - scripts/trace-ios-owned-process.py
      - scripts/test-ios-process-trace.py
  workflow_dispatch:
    inputs:
      mode:
        description: Ultimo esperimento CLI con device set proprio, nessun gate app
        required: true
        default: preflight
        type: choice
        options:
          - preflight

permissions:
  contents: read

jobs:
  measured-ios:
    name: Owned iOS measured device-set CLI experiment
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Validate measured transport
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-ios-process-trace.py
          bash scripts/check-action-pins.sh
      - name: Minimal owned preflight
        run: |
          python3 scripts/run-ios-preflight-measured.py \
            --output build/task054/ios-measured --inventory-scope device-set
      - name: Save CLI measurements and ownership receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task054-ios-measured
          path: |
            build/task054/ios-measured/*.json
            build/task054/ios-measured/*.jsonl
            build/task054/ios-measured/*.txt
          retention-days: 7
          if-no-files-found: error
